name: Build & Deploy Awqaf Platform (Web, EXE, APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. نشر الموقع تلقائياً على GitHub Pages
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload www artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. بناء تطبيق الحاسوب (Windows EXE)
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r desktop/requirements.txt

      - name: Build Awqaf.exe
        run: python -m PyInstaller --noconfirm --clean --noconsole --onefile --name "Awqaf" --add-data "www;www" desktop/app.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awqaf-Windows-EXE
          path: dist/Awqaf.exe

  # 3. بناء تطبيق الجوال (Android APK)
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Init Capacitor & Install dependencies
        run: |
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "sy.gov.awqaf.schedules",
            "appName": "برامج الثانويات الشرعية",
            "webDir": "www"
          }
          EOF
          fi

      - name: Add and sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Awqaf-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
